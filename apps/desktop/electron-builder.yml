appId: com.icrlogin.desktop
productName: ICRLogin
asar: true
directories:
  output: dist
files:
  - out/**/*
  - package.json
publish:
  - provider: github
    owner: luongdo03x-byte
    repo: ICRLOGIN
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ICRLogin-${version}-Setup-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ICRLogin
