name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $package = Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          if ($package.version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match desktop package version $($package.version)"
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Test all workspaces
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Verify signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { throw 'WIN_CSC_LINK secret is required' }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { throw 'WIN_CSC_KEY_PASSWORD secret is required' }

      - name: Build signed NSIS release
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package:release -w @icrlogin/desktop

      - name: Verify signed release artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path 'apps/desktop/dist/latest.yml')) { throw 'latest.yml was not generated' }
          $installer = Get-ChildItem 'apps/desktop/dist' -Filter 'ICRLogin-*-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -eq 'NotSigned') { throw 'Release installer is not signed' }
          Write-Host "Signature status: $($signature.Status)"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            Get-ChildItem 'apps/desktop/dist' -File |
              Where-Object { $_.Name -eq 'latest.yml' -or $_.Name -match '^ICRLogin-.*-Setup-x64\.exe(?:\.blockmap)?$' } |
              ForEach-Object { $_.FullName }
          )
          if ($files.Count -lt 2) { throw 'Release artifacts are incomplete' }
          gh release create '${{ github.ref_name }}' @files --repo '${{ github.repository }}' --verify-tag --title "ICRLogin ${{ github.ref_name }}" --generate-notes
