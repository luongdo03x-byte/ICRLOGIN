name: Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/phase-8-*'
  pull_request:
    branches:
      - main

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test all workspaces
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Package unsigned Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:win

      - name: Verify update artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path 'apps/desktop/dist/latest.yml')) { throw 'latest.yml was not generated' }
          $installer = Get-ChildItem 'apps/desktop/dist' -Filter 'ICRLogin-*-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          Write-Host "Installer: $($installer.Name)"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ICRLogin-windows-x64
          if-no-files-found: error
          path: |
            apps/desktop/dist/ICRLogin-*-Setup-x64.exe
            apps/desktop/dist/ICRLogin-*-Setup-x64.exe.blockmap
            apps/desktop/dist/latest.yml
