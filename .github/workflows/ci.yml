name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test all workspaces
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build desktop
        run: npm run build -w @icrlogin/desktop
      - name: Chromium integration and local API automation smoke
        run: npm run test:integration:chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
